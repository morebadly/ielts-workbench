# netlify.toml — IELTS Workbench Next.js 部署配置
#
# 走 Netlify 官方 Next.js Runtime,自动支持:
#   - App Router / Server Components
#   - API Routes (/api/ai/*)
#   - 静态化页面 + 动态路由
#
# 不要手动加 `command = "next build"`,Netlify Next.js plugin 会自己处理,
# 而且会同时帮你建 functions、edge functions、static 资产。

[build]
  command = "next build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  # 给 /api/import/pdf 这条路足够时间跑(默认 10s,我们的 PDF 提取经常更久)
  node_bundler = "esbuild"

# /api/import/pdf 单独提高超时
[functions."api/import/pdf"]
  timeout = 60

[functions."api/ai/chat"]
  timeout = 30

[functions."api/ai/tts"]
  timeout = 30

# 安全 headers — 跟 Vercel 默认基本对齐
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Next.js 静态资源默认就是 immutable,这里再加一道明确的 cache
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
